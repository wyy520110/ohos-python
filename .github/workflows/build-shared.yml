name: Build Python with Shared Library

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Patch build.sh - skip OHOS ARM64 tools, use system tools
        run: |
          # 跳过下载 OHOS ARM64 工具（在 x86_64 上无法执行）
          sed -i '/Harmonybrew\/ohos-coreutils/s/^/#SKIP: /' build.sh
          sed -i '/Harmonybrew\/ohos-unzip/s/^/#SKIP: /' build.sh
          sed -i '/Harmonybrew\/ohos-grep/s/^/#SKIP: /' build.sh
          sed -i '/Harmonybrew\/ohos-gawk/s/^/#SKIP: /' build.sh
          sed -i '/Harmonybrew\/ohos-make/s/^/#SKIP: /' build.sh
          sed -i '/Harmonybrew\/ohos-tar/s/^/#SKIP: /' build.sh
          sed -i '/Harmonybrew\/ohos-gzip/s/^/#SKIP: /' build.sh
          sed -i '/Harmonybrew\/ohos-perl/s/^/#SKIP: /' build.sh

          # 跳过 ln -sf 到 /bin 的链接（用系统自带工具）
          sed -i '/ln -sf.*\/bin\//s/^/#SKIP: /' build.sh

          # 添加 --enable-shared 到 configure
          sed -i '/\.\/configure/s/$/ --enable-shared/' build.sh

          # 验证修改
          echo "=== Skipped lines ==="
          grep -c "SKIP:" build.sh
          echo "=== Configure line ==="
          grep "configure" build.sh | grep -v SKIP

      - name: Build
        run: sudo bash build.sh

      - name: Check output
        run: |
          find python-3.14.6-ohos-arm64 -name "python3" -o -name "libpython*.so*" | head -10
          ls -la python-3.14.6-ohos-arm64/bin/ 2>/dev/null || echo "No bin"

      - uses: actions/upload-artifact@v4
        with:
          name: python-ohos-shared
          path: python-3.14.6-ohos-arm64.tar.gz
